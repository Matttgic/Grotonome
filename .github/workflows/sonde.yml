name: Sonde

on:
  workflow_dispatch:

jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer
        run: python -m pip install -e .
      - name: Mesurer les sources depuis le runner
        run: python -m grotonome sonde
