name: Sonde

on:
  workflow_dispatch:
  # Un push qui touche ce fichier relance une mesure depuis le runner.
  # Les autres commits ne rappellent pas les bookmakers.
  push:
    branches: [main]
    paths:
      - .github/workflows/sonde.yml

jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer
        run: python -m pip install -e .
      - name: Mesurer les sources depuis le runner
        run: python -m grotonome sonde
