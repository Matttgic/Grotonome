name: Quotidien

on:
  # Le rythme continu est dans veille.yml. Ce workflow reste un relevé manuel.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: grotonome-quotidien
  cancel-in-progress: false

jobs:
  releve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer
        run: python -m pip install -e .
      - name: Relevé
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BANKROLL_EUR: ${{ vars.BANKROLL_EUR }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m grotonome run
      - name: Enregistrer le journal
        run: |
          git config user.name "grotonome"
          git config user.email "grotonome@users.noreply.github.com"
          git add site/latest.json data/journal.jsonl data/sharp.jsonl data/cotes.jsonl
          if git diff --cached --quiet; then
            echo "rien de nouveau"
            exit 0
          fi
          git commit -m "données : relevé $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - name: Préparer GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    needs: releve
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
